<!-- Section Heading -->
<h2 style="margin: 0 0 10px; font-size: 18px; font-weight: 700; color: #071A35; font-family: Arial, Helvetica, sans-serif;">
  {{header}}
</h2>

<!-- Body Text -->
<p style="margin: 0 0 24px; font-size: 14px; color: {{text_secondary}}; font-family: Arial, Helvetica, sans-serif; line-height: 1.6;">
  {{body_text}}
</p>

<!-- OTP Display Box (rendered dynamically in Python) -->
{{otp_display}}

<!-- Expiry Warning -->
<p style="margin: 20px 0 0; font-size: 13px; color: {{text_secondary}}; font-family: Arial, Helvetica, sans-serif; line-height: 1.5;">
  This code expires in {{otp_expire_minutes}} minutes. Please do not share it with anyone.
</p>

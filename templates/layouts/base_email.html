<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <!--[if mso]>
    <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <![endif]-->
    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; display: block; }
      table { border-collapse: collapse !important; }
      body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
      @media screen and (max-width: 620px) {
        .email-container { width: 100% !important; max-width: 100% !important; }
        .header-pad { padding: 12px 16px !important; }
        .hero-pad { padding: 22px 20px 18px !important; }
        .content-pad { padding: 24px 20px !important; }
        .footer-pad { padding: 20px 20px !important; }
        .otp-font { font-size: 26px !important; letter-spacing: 6px !important; }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #E0E5ED;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #E0E5ED;">
      <tr>
        <td align="center" style="padding: 24px 12px;">

          <!--[if mso]><table role="presentation" align="center" border="0" cellspacing="0" cellpadding="0" width="620"><tr><td><![endif]-->
          <table class="email-container" role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 620px; margin: 0 auto; background-color: #ffffff;">

            <!-- 1. Upper  STRIP                         -->
            <tr>
              <td height="5" bgcolor="#00A74F" style="background: linear-gradient(90deg, #00A74F 0%, #4473BD 100%); font-size: 0; line-height: 0; mso-line-height-rule: exactly;">&nbsp;</td>
            </tr>

            <!-- 2. WHITE HEADER — Logo + Location           -->
            <tr>
              <td class="header-pad" style="background-color: #ffffff; padding: 14px 24px; border-bottom: 1px solid #EFEFEF;">
                <table width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td valign="middle">
                      <img src="{{logo_url}}" alt="KampuLynk" width="44" height="44" style="border-radius: 8px; border: 1px solid #E8ECF0; width: 44px; height: 44px;">
                      <div style="font-size: 10px; color: #999999; margin-top: 4px; font-family: Arial, Helvetica, sans-serif; letter-spacing: 0.8px;">Connect &#8226; Learn &#8226; Grow</div>
                    </td>
                    <td align="right" valign="middle" style="font-size: 20px; font-family: Arial, Helvetica, sans-serif; white-space: nowrap; padding-left: 16px;">
                      <span style="background: linear-gradient(180deg, #00A74F 0%, #4473BD 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">KampuLynk</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- 3. DARK NAVY HERO BANNER                    -->
            <tr>
              <td class="hero-pad" style="background-color: #071A35; padding: 30px 28px 26px;">
                <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #ffffff; font-family: Arial, Helvetica, sans-serif; line-height: 1.3;">{{title}}</h1>
                <p style="margin: 0; font-size: 13px; color: #64A0D4; font-family: Arial, Helvetica, sans-serif; font-weight: 500;">KampuLynk</p>
              </td>
            </tr>

            <!-- 4. WHITE CONTENT AREA (injected per-email)  -->
            <tr>
              <td class="content-pad" style="background-color: #e3e0e0f1; padding: 32px 28px; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #333333; line-height: 1.6;">
                {{body_html}}
              </td>
            </tr>

            <!-- 5. DARK NAVY FOOTER                         -->
            <tr>
              <td class="footer-pad" style="background-color: #071A35; padding: 24px 28px;">
                <p style="margin: 0 0 14px; font-size: 12px; color: #94A3B8; font-family: Arial, Helvetica, sans-serif; line-height: 1.7;">
                  This notification was sent by KampuLynk. If you did not request this, you can safely ignore it.
                </p>
                <div style="border-top: 1px solid #1E3A5F; padding-top: 14px;">
                  <p style="margin: 0 0 4px; font-size: 11px; color: #475569; font-family: Arial, Helvetica, sans-serif;">
                    &#169; 2026 KampuLynk. All rights reserved.
                  </p>
                  <p style="margin: 0; font-size: 11px; color: #475569; font-family: Arial, Helvetica, sans-serif;">
                    Connecting students, alumni, mentors, and opportunities worldwide.
                  </p>
                </div>
              </td>
            </tr>

          </table>
          <!--[if mso]></td></tr></table><![endif]-->

        </td>
      </tr>
    </table>

  </body>
</html>

<!doctype html>
<html>
  <body style="margin:0;padding:0;background:{{light_gray}};font-family:Arial,Helvetica,sans-serif;color:{{black}};">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:{{light_gray}};padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-collapse:collapse;border:1px solid #d7d7d7;">
            <tr>
              <td style="height:8px;background:{{crimson}};font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding: 16px 28px; background: #ffffff; border-bottom: 1px solid #eeeeee;">
                <table width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="vertical-align: middle;">
                      <img src="{{logo_url}}" alt="KSOLVES" width="150" style="display: block; border: 0;"/>
                      <div style="font-size: 10px; color: {{dark_gray}}; margin-top: 4px; font-weight: 600;">AI First, Always</div>
                    </td>
                    <td align="right" style="vertical-align: middle; color: {{dark_gray}}; font-size: 12px; font-weight: 500;">
                      <span style="color: {{crimson}}; font-size: 14px; margin-right: 4px;">📍</span>India, USA, Dubai
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="background:{{deep_navy}};padding:24px 28px;">
                <div style="color:#ffffff;font-size:20px;font-weight:700;line-height:1.35;">{{title}}</div>
                <div style="color:{{light_gray}};font-size:13px;margin-top:6px;">KampuLynk</div>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;background:#ffffff;color:{{dark_gray}};font-size:15px;line-height:1.65;">
                {{body_html}}
              </td>
            </tr>
            <tr>
              <td style="background:{{dark_navy}};padding:24px 28px;color:{{light_gray}};font-size:12px;line-height:1.5;">
                <div style="margin-bottom: 16px;">This notification was sent by KampuLynk. If you did not request this, you can safely ignore it.</div>
                <div style="border-top: 1px solid #334155; padding-top: 16px; font-size: 11px; color: #94a3b8;">
                  &copy; 2024 KSolves India Limited. All rights reserved. <br/>
                  Innovation and Excellence in AI & Technology.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
